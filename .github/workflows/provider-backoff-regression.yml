name: Provider Backoff Regressions
on:
  pull_request:
    paths:
      - "backend/app/services/provider_usage.py"
      - "backend/app/services/fmp_client.py"
      - "backend/app/services/fundamentals_cache.py"
      - "backend/app/services/price_lookup.py"
      - "backend/tests/test_fmp_account_suspension.py"
      - "backend/tests/test_provider_usage_contention.py"
      - ".github/workflows/provider-backoff-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-backoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite://
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest
      - working-directory: backend
        run: >-
          python -m pytest
          tests/test_fmp_account_suspension.py
          tests/test_fmp_shutdown_transport.py
          tests/test_provider_usage_hot_routes.py
          tests/test_provider_usage_contention.py
          tests/test_cache_first_fmp_remaining.py
          tests/test_price_lookup_index.py
          tests/test_price_lookup_date_clamping.py
          tests/test_price_threshold_freshness.py
          tests/test_quote_lookup_timezone.py
          tests/test_financial_consumer_provider.py
          tests/test_fundamentals_snapshots.py
          tests/test_fundamentals_cache.py
          tests/test_fundamentals_provider_baseline.py
          tests/test_outcome_horizon_price_reads.py
          tests/test_watchlist_price_alert_job.py
          tests/test_price_alert_reference.py
          -q --disable-warnings --junitxml=provider-backoff.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-backoff-results
          path: backend/provider-backoff.xml
          retention-days: 7
