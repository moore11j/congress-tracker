name: Search Regressions
on:
  pull_request:
    paths:
      - "backend/app/services/search_suggest.py"
      - "backend/app/services/universal_search.py"
      - "backend/app/services/sec_metadata.py"
      - "backend/app/services/sec_directory.py"
      - "backend/tests/test_search_suggest.py"
      - "backend/tests/test_universal_search.py"
      - "backend/tests/test_sec_metadata_consumers.py"
      - ".github/workflows/search-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite://
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest
      - working-directory: backend
        run: python -m pytest tests/test_search_suggest.py tests/test_universal_search.py tests/test_sec_metadata_consumers.py -q --junitxml=search-results.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: backend/search-results.xml
          retention-days: 7
