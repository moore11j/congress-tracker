name: Massive Price Compatibility
on:
  pull_request:
    paths:
      - "backend/app/clients/massive_stocks.py"
      - "backend/app/services/price*.py"
      - "backend/app/services/quote_lookup.py"
      - "backend/app/services/custom_alert_rules.py"
      - "backend/app/services/confirmation_monitoring.py"
      - "backend/app/services/email_intraday.py"
      - "backend/app/services/email_digests.py"
      - "backend/app/jobs/run_watchlist_price_alerts.py"
      - "backend/tests/test_massive*.py"
      - "frontend/tests/research-delayed-quotes.test.mjs"
      - ".github/workflows/massive-price-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite://
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest httpx httpx2
      - working-directory: backend
        run: >-
          python -m pytest
          tests/test_massive_price_core.py tests/test_massive_price_alert_replay.py
          tests/test_massive_public_callers.py tests/test_massive_absolute_alerts.py
          tests/test_massive_financials_contract.py tests/test_price_alert_reference.py
          tests/test_price_threshold_freshness.py tests/test_watchlist_price_alert_job.py
          tests/test_price_lookup_date_clamping.py tests/test_quote_lookup_timezone.py
          tests/test_price_lookup_index.py tests/test_market_quotes.py
          tests/test_market_pressure.py tests/test_market_pressure_ingest.py
          tests/test_fmp_shutdown_transport.py tests/test_independent_fundamentals.py
          tests/test_fundamentals_provider_baseline.py tests/test_member_quote_cache.py
          tests/test_outcome_horizon_price_reads.py tests/test_institutional_price_boundaries.py
          tests/test_confirmation_monitoring.py
          tests/test_massive_digest_observations.py tests/test_email_digests.py
          tests/test_digest_source_integrity.py tests/test_top_ideas_digest.py
          -q --disable-warnings --junitxml=massive-price-results.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massive-price-results
          path: backend/massive-price-results.xml
          retention-days: 7
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: frontend
        run: npx tsc --noEmit --incremental false
      - working-directory: frontend
        run: node --test tests/research-delayed-quotes.test.mjs tests/research-actions.test.mjs tests/research-market-prices.test.mjs tests/ticker-context-bundle.test.mjs tests/ticker-fetch-freshness.test.mjs
