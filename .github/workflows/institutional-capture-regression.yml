name: Institutional Capture Regressions

on:
  pull_request:
    paths:
      - "backend/app/services/institutional_capture_*.py"
      - "backend/app/jobs/capture_direct_13f_evidence.py"
      - "backend/tests/test_institutional_capture_*.py"
      - ".github/workflows/institutional-capture-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite://
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Verify capture and source acceptance guards
        working-directory: backend
        run: python -m pytest tests/test_institutional_capture_position_pages.py tests/test_institutional_capture_event_ids.py tests/test_institutional_capture_transport.py tests/test_institutional_capture_file.py tests/test_institutional_capture_receive.py tests/test_institutional_capture_job.py -q --disable-warnings --maxfail=3
