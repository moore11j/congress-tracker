name: Walnut workspace regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/app/discover/**'
      - 'frontend/app/my-stocks/**'
      - 'frontend/components/discover/**'
      - 'frontend/components/AppTopNav.tsx'
      - 'frontend/components/watchlists/WatchlistsDashboard.tsx'
      - 'frontend/middleware.ts'
      - 'frontend/tests/discover-render.test.mjs'
      - 'frontend/tests/my-stocks-return.test.mjs'
      - 'frontend/tests/seo-canonicalization.test.mjs'
      - '.github/workflows/walnut-workspace-regression.yml'

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/discover-render.test.mjs tests/my-stocks-return.test.mjs
      - run: node --test --test-name-pattern='workspace discovery|My Stocks' tests/seo-canonicalization.test.mjs
      - run: npx tsc --noEmit --incremental false
