name: Institutional Preparation Regressions
on:
  pull_request:
    paths:
      - 'backend/app/services/direct_13f_*.py'
      - 'backend/app/services/direct_feed_*.py'
      - 'backend/app/clients/direct_sources.py'
      - 'backend/app/jobs/*13f*.py'
      - 'backend/tests/test_direct_13f*.py'
      - '.github/workflows/institutional-preparation-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: institutional_preparation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: sqlite://
      PYTHONPATH: .
      INSTITUTIONAL_TEST_POSTGRES_URL: postgresql+psycopg://postgres:isolated-test-only@127.0.0.1:5432/institutional_preparation_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Complete-source, restart and real PostgreSQL contracts
        working-directory: backend
        run: >-
          python -m pytest tests/test_direct_13f_preparation.py tests/test_direct_13f_preparation_postgres.py
          tests/test_direct_13f_batch.py tests/test_direct_13f_evidence.py tests/test_direct_13f_worker.py
          tests/test_direct_13f_publication.py tests/test_direct_13f_capacity.py
          tests/test_direct_13f_streamed_peers.py tests/test_direct_13f_prepared_evidence.py
          -q --disable-warnings --junitxml=institutional-preparation-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institutional-preparation-results
          path: backend/institutional-preparation-results.xml
