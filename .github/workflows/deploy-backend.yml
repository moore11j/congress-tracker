name: Deploy Production Backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the requested release
        uses: actions/checkout@v6

      - name: Install flyctl
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy API and cron with rolling health checks
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl deploy --app congress-tracker-api --remote-only --strategy rolling \
            --image-label "release-${GITHUB_SHA}" --wait-timeout 180s
          flyctl status --app congress-tracker-api

      - name: Verify production Research Memory routes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = 'https://congress-tracker-api.fly.dev'
          def get(path):
              with urllib.request.urlopen(base + path, timeout=30) as response:
                  assert response.status == 200, (path, response.status)
                  return json.load(response)

          assert get('/ready')['database'] == 'ok'
          data = get('/api/tickers/MU/operational-intelligence')
          assert data['symbol'] == 'MU'
          assert {'catalysts', 'risks', 'opportunities', 'watch_next', 'coverage'} <= data.keys()
          assert len(data['coverage']) == 3
          try:
              get('/api/research-memory')
          except urllib.error.HTTPError as error:
              assert error.code in (401, 403), error.code
          else:
              raise AssertionError('Private Research Memory route accepted an anonymous request')
          print('Production readiness, operational evidence schema, and private route checks passed.')
          PY
