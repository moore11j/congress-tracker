name: Public Ticker Regressions
on:
  pull_request:
    paths:
      - "backend/app/main.py"
      - "backend/app/services/public_ticker_snapshot.py"
      - "backend/tests/test_public_ticker*.py"
      - ".github/workflows/public-ticker-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-ticker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite://
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest
      - working-directory: backend
        run: python -m pytest tests/test_public_ticker_snapshot.py tests/test_public_ticker_render_cache.py tests/test_ticker_context_canonical_projection.py -q --disable-warnings --junitxml=public-ticker-results.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ticker-results
          path: backend/public-ticker-results.xml
          retention-days: 7
